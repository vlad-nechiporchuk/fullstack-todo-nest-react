name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://todo:todo@localhost:5432/todo_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Takes the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm exec biome ci .
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:int
      - name: Build
        run: pnpm build

  stack:
    name: Whole stack with one command
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start the stack
        run: docker compose up --build --detach --wait
      - name: Smoke test through the web app
        run: |
          curl --fail --silent --show-error http://localhost:8080/ | grep --quiet "<title>taskly</title>"
          curl --fail --silent --show-error http://localhost:8080/api/health/ready
          curl --fail --silent --show-error --request POST http://localhost:8080/api/v1/tasks \
            --header "Content-Type: application/json" --data '{"title":"Smoke test"}'
          curl --fail --silent --show-error http://localhost:8080/api/v1/tasks | grep --quiet "Smoke test"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

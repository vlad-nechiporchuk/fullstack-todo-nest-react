server {
  listen 8080;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's DNS: the API is looked up per request, so a recreated API container with a new address is still found.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Same origin for the browser: the API is reached through this server, so it needs no CORS.
  location /api/ {
    set $api_upstream http://api:3001;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # An add_header in a location drops the server's ones, so each location that sets its own includes these.
  # File names carry a content hash, so a cached copy can never go stale.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
